      <p style="font-size:0.88rem; color:#556268; margin-top:6px;">Plataforma de Gestão e Organização de Eventos</p>
    </div>

    <div class="module-tabs" style="justify-content:center;">
      <button class="module-tab active" data-target="tab-login">Entrar</button>
      <button class="module-tab" data-target="tab-cadastro">Cadastrar Cliente</button>
      <button class="module-tab" data-target="tab-senha">Recuperar Senha</button>
    </div>

    <!-- Login (RF047 & RF050) -->
    <div id="tab-login" class="tab-panel active">
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Perfil de Acesso (Apenas para Demonstração)</label>
          <select id="loginRole" class="form-control">
            <option value="Administrador">Administrador (Acesso Total)</option>
            <option value="Funcionário / Produtor">Funcionário / Produtor</option>
            <option value="Cliente">Cliente (Orçamentos & Agenda)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Login ou E-mail</label>
          <input type="text" class="form-control" value="joao.luiz" required>
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" class="form-control" value="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:6px;">Entrar no Sistema</button>
      </form>

      <div style="margin-top:18px; padding-top:16px; border-top:1px solid var(--color-border); text-align:center;">
        <p style="font-size:0.8rem; color:#66747a; margin-bottom:10px;">Ou entre com rede social:</p>
        <div style="display:flex; gap:10px;">
          <button class="btn btn-outline btn-sm" style="flex:1;" onclick="socialLogin('Google')">Continuar com Google</button>
          <button class="btn btn-outline btn-sm" style="flex:1;" onclick="socialLogin('Microsoft')">Continuar com Microsoft</button>
        </div>
      </div>
    </div>

    <!-- Auto-cadastro Cliente (RF004 & RF018) -->
    <div id="tab-cadastro" class="tab-panel">
      <form onsubmit="handleClientRegister(event)">
        <div class="form-grid">
          <div class="form-group">
            <label>CPF / CNPJ</label>
            <input type="text" id="cliDoc" class="form-control" required placeholder="000.000.000-00">
          </div>
          <div class="form-group">
            <label>RG / Inscrição Estadual</label>
            <input type="text" id="cliRg" class="form-control" required>
          </div>
        </div>
        <div class="form-group">
          <label>Nome Completo / Razão Social</label>
          <input type="text" id="cliNome" class="form-control" required>
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label>E-mail de Contato</label>
            <input type="email" id="cliEmail" class="form-control" required>
          </div>
          <div class="form-group">
            <label>Telefones de Contato</label>
            <input type="text" id="cliTel" class="form-control" required placeholder="(41) 9 9999-9999">
          </div>
        </div>
        <div class="form-group">
          <label>Endereço Completo</label>
          <input type="text" id="cliEnd" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Concluir Cadastro e Acessar</button>
      </form>
    </div>

    <!-- Solicitar Nova Senha (RF049) -->
    <div id="tab-senha" class="tab-panel">
      <form onsubmit="event.preventDefault(); showToast('Link de redefinição enviado para o e-mail cadastrado.');">
        <div class="form-group">
          <label>E-mail Cadastrado</label>
          <input type="email" class="form-control" required placeholder="seuemail@dominio.com.br">
        </div>
        <button type="submit" class="btn btn-dark" style="width:100%;">Solicitar Nova Senha</button>
      </form>
    </div>

    <div style="text-align:center; margin-top:18px;">
      <a href="index.html" style="font-size:0.84rem; color:var(--color-primary);">← Voltar para o Site Institucional</a>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    initModuleTabs();
    const params = new URLSearchParams(window.location.search);
    if (params.get('role')) document.getElementById('loginRole').value = params.get('role');
    if (params.get('tab') === 'cadastro') document.querySelector('[data-target="tab-cadastro"]').click();

    function handleLogin(e) {
      e.preventDefault();
      const role = document.getElementById('loginRole').value;
      setCurrentRole(role);
      const target = ROLE_CONFIG[role].allowedPages[0];
      window.location.href = target;
    }

    function socialLogin(provider) {
      setCurrentRole('Cliente');
      showToast(`Autenticado via ${provider}. Redirecionando...`);
      setTimeout(() => window.location.href = 'agenda.html', 1000);
    }

    function handleClientRegister(e) {
      e.preventDefault();
      const db = getDB();
      const newCode = 'CLI-' + String(db.cadastros.length + 1).padStart(3, '0');
      db.cadastros.push({
        codigo: newCode,
        categoria: 'Cliente',
        doc: document.getElementById('cliDoc').value,
        rgIe: document.getElementById('cliRg').value,
        nome: document.getElementById('cliNome').value,
        email: document.getElementById('cliEmail').value,
        telefones: document.getElementById('cliTel').value,
        endereco: document.getElementById('cliEnd').value,
        extra: 'Auto-cadastro Web'
      });
      saveDB(db);
      setCurrentRole('Cliente');
      showToast(`Cliente ${newCode} vinculado ao usuário automaticamente!`);
      setTimeout(() => window.location.href = 'agenda.html', 900);
    }
  </script>
